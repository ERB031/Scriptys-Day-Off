services:
  - type: web
    name: scriptys-day-off-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: BACKEND_URL
        value: https://scriptys-day-off-backend.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: '["https://scriptys-day-off.vercel.app","https://scriptys-day-off-git-main-erb031s-projects.vercel.app","https://scriptys-day-off-erb031s-projects.vercel.app"]'
